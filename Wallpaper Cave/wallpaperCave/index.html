<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WallpaperCave</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-3 fixed-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="logo.png" alt="Logo" height="40" class="me-2" />
      <span>WallpaperCave</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-clock text-warning me-1"></i>Latest</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-bars text-warning me-1"></i>Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-plus text-warning me-1"></i>Upload</a></li>
      </ul>

      <form class="d-flex me-3" role="search">
        <input class="form-control me-2" type="search" id="searchInput" placeholder="Search Wallpaper" />
        <button class="btn  btn-outline-warning" id="searchBtn" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
      </form>

      <!-- Auth Buttons -->
      <a href="#" class="btn sign btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#signinModal">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
      </a>
      <a href="#" class="btn sign btn-warning text-dark fw-bold" data-bs-toggle="modal" data-bs-target="#signupModal">Create Account</a>
    </div>
  </div>
</nav>

<!-- Hero Section -->
<section class="hero-section d-flex flex-column justify-content-center align-items-center text-center text-light">
  <div class="overlay"></div>

  <div class="hero-content position-relative">
    <h1 class="fw-bold mb-4 text-shadow-lg">Welcome To WallpaperCave!</h1>
    <div class="input-group w-75 w-md-50 mx-auto">
      <input
        type="text"
        class="form-control form-control-lg"
        id="mainSearch"
        placeholder="Search Wallpaper"
      />
      <button class="btn btn-warning btn-lg" id="mainSearchBtn">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>
  </div>
</section>


  <!-- Trending Section -->
  <section class="bg-dark text-light text-center py-5">
    <h2 class="text-decoration-underline text-warning mb-4">Trending This Week</h2>
    <div class="container">
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <button class="btn btn-outline-warning btn-sm">Autumn</button>
        <button class="btn btn-outline-warning btn-sm">Naruto</button>
        <button class="btn btn-outline-warning btn-sm">One Piece</button>
        <button class="btn btn-outline-warning btn-sm">4K</button>
        <button class="btn btn-outline-warning btn-sm">Cyberpunk</button>
        <button class="btn btn-outline-warning btn-sm">Batman</button>
        <button class="btn btn-outline-warning btn-sm">Blue Lock</button>
        <button class="btn btn-outline-warning btn-sm">Aesthetic</button>
      </div>
    </div>
  </section>

<!-- Featured Wallpapers -->
<section class="bg-dark text-light text-center py-5">
  <h2 class="text-decoration-underline text-warning mb-5">Featured Desktop Wallpapers</h2>
  <div class="container">
    
    <!-- Dynamic Wallpaper Container -->
    <div id="wallpaperContainer" class="row g-3"></div>

    <!-- Pagination Controls -->
    <div class="d-flex justify-content-center mt-4 gap-3">
      <button class="btn btn-outline-warning" id="prevBtn">⟨ Previous</button>
      <span id="pageIndicator" class="align-self-center fw-bold text-warning"></span>
      <button class="btn btn-outline-warning" id="nextBtn">Next ⟩</button>
    </div>

  </div>
</section>


  <!-- Footer -->
  <footer class="bg-secondary text-center text-light py-3">
    <p class="mb-0">© 2025 WallpaperCave | Designed by Atif Ayyoub</p>
  </footer>

  <!-- Authentication Modals -->
  <div id="auth-modals">
    <!-- include modals from script.js -->
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
